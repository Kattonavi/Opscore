spring.application.name=opscore-api

# Active profile. Override with SPRING_PROFILES_ACTIVE (Railway: prod).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Server ----
# Railway provides PORT at runtime. 8080 is used for local dev.
server.port=${PORT:8080}

# ---- Datasource ----
# All values come from env vars. The local defaults match the legacy dev setup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opscore_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ---- JPA ----
# ddl-auto: profile-specific. Common default is "validate" to fail fast.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# ---- JWT ----
# JWT_SECRET MUST be set in any non-dev environment (32+ bytes / 256 bits).
# The default below is only suitable for local development.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-min-32-bytes-long-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- CORS ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Actuator (used by Railway healthcheck) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Swagger / OpenAPI ----
# Disable both the UI and the JSON spec endpoints by setting these to false
# (recommended for production deployments that should not expose the API
# surface publicly).
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

# ---- Mail (welcome email) ----
# Real SMTP delivery is OPT-IN. With opscore.mail.enabled=false (default)
# the WelcomeEmailService runs in log-only mode and the SMTP block below
# is irrelevant. Set OPSCORE_MAIL_ENABLED=true together with the SMTP_*
# env vars to activate real delivery. The auto-configured JavaMailSender
# uses spring.mail.* properties below.
opscore.mail.enabled=${OPSCORE_MAIL_ENABLED:false}
opscore.mail.from=${MAIL_FROM:}

# SMTP transport (driven by env vars; empty defaults so a misconfigured
# environment fails loudly with a warning at first send instead of at boot).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

# STARTTLS — the modern default for ports 587/2525. If your provider
# requires implicit TLS on port 465, set SMTP_PORT=465 and override:
#   spring.mail.properties.mail.smtp.ssl.enable=true
#   spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
