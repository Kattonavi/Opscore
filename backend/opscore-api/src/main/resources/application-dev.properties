# Dev profile — relaxed schema management and verbose SQL.
# Activated by SPRING_PROFILES_ACTIVE=dev (default in application.properties).

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seed roles/areas/admin on startup (idempotent). Disable in prod.
opscore.seed.enabled=${OPSCORE_SEED_ENABLED:true}
opscore.seed.admin.email=${OPSCORE_SEED_ADMIN_EMAIL:admin@opscore.com}
opscore.seed.admin.password=${OPSCORE_SEED_ADMIN_PASSWORD:abcd1234}
