# Production profile — safe defaults for Railway / cloud deployments.
# Activated by SPRING_PROFILES_ACTIVE=prod.

# Never auto-mutate the schema in production. Use a migration tool (Flyway/Liquibase)
# or run controlled DDL manually. "validate" only checks that entities match.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Hide stack traces from API responses
server.error.include-stacktrace=never
server.error.include-message=never

# Tighter HikariCP defaults for small Railway containers
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}

# Production defaults: keep demo seed and public API docs disabled unless
# explicitly enabled for a controlled staging/demo window.
opscore.seed.enabled=${OPSCORE_SEED_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
